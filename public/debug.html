<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTrack Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow">
        <h1 class="text-3xl font-bold mb-6">AquaTrack Debug Panel</h1>
        
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-2">Current Token Info</h2>
            <div id="token-info" class="bg-gray-100 p-4 rounded"></div>
        </div>
        
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-2">Test Endpoints</h2>
            <div class="space-y-2">
                <button onclick="testEndpoint('/api/test-manager-routes')" class="bg-blue-500 text-white px-4 py-2 rounded">Test Manager Routes</button>
                <button onclick="testEndpoint('/api/partners')" class="bg-blue-500 text-white px-4 py-2 rounded">Test GET /api/partners</button>
                <button onclick="testEndpoint('/api/users')" class="bg-blue-500 text-white px-4 py-2 rounded">Test GET /api/users</button>
                <button onclick="testEndpoint('/api/admin/projects')" class="bg-blue-500 text-white px-4 py-2 rounded">Test GET /api/admin/projects</button>
            </div>
        </div>
        
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-2">Results</h2>
            <div id="results" class="bg-gray-100 p-4 rounded font-mono text-sm whitespace-pre-wrap"></div>
        </div>
    </div>
    
    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }
        
        // Show token info
        const token = localStorage.getItem('token');
        const tokenInfo = document.getElementById('token-info');
        if (token) {
            const decoded = parseJwt(token);
            tokenInfo.innerHTML = `
                <div><strong>Token exists:</strong> Yes</div>
                <div><strong>User ID:</strong> ${decoded?.id || 'N/A'}</div>
                <div><strong>Email:</strong> ${decoded?.email || 'N/A'}</div>
                <div><strong>Role:</strong> ${decoded?.role || 'N/A'}</div>
                <div><strong>Expires:</strong> ${decoded?.exp ? new Date(decoded.exp * 1000).toLocaleString() : 'N/A'}</div>
            `;
        } else {
            tokenInfo.innerHTML = '<div class="text-red-600">No token found. Please log in first.</div>';
        }
        
        async function testEndpoint(endpoint) {
            const results = document.getElementById('results');
            results.textContent = `Testing ${endpoint}...\n`;
            
            const token = localStorage.getItem('token');
            if (!token) {
                results.textContent += '\nERROR: No token found. Please log in first.';
                return;
            }
            
            try {
                const response = await fetch(endpoint, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                results.textContent += `Status: ${response.status} ${response.statusText}\n\n`;
                
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    results.textContent += 'Response:\n' + JSON.stringify(data, null, 2);
                } else {
                    const text = await response.text();
                    results.textContent += 'Response:\n' + text;
                }
            } catch (error) {
                results.textContent += `\nERROR: ${error.message}`;
            }
        }
    </script>
</body>
</html>
